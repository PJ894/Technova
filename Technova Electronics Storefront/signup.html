<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechNova Electronics - Sign Up</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Internal CSS -->
    <style>
        nav ul {
            border-bottom: 3px solid #0077cc;
        }
        main h2 {
            color: #0d47a1;
            text-align: center;
        }
        footer {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            background-color: #f5f5f5;
        }
        .error-message {
            color: #FF0000;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<!-- Header -->
<header style="background-color: #0d3b66;" class="d-flex align-items-center p-3">
    <div class="logo me-3">
        <img src="images/technova%20electronics.png" alt="TechNova Electronics Logo" style="height: 70px;">
    </div>
    <div class="company-name">
        <h1 style="color: white; margin: 0;">TechNova Electronics</h1>
    </div>
</header>

<!-- Navigation -->
<nav>
    <ul class="nav justify-content-center bg-light p-2">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html">Shopping Cart</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link active" href="signup.html">Sign Up</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
    </ul>
</nav>

<!-- Main Content -->
<main class="container my-5">
    <h2 class="text-center mb-4">Create Your Account</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4 rounded-4">
                <form id="signupForm" onsubmit="return validateForm()">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" onfocusout="validateField(this)">
                        <div id="usernameError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email" onfocusout="validateField(this)">
                        <div id="emailError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" onfocusout="validateField(this)">
                        <div id="passwordError" class="error-message"></div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" onfocusout="validateField(this)">
                        <div id="confirmPasswordError" class="error-message"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                </form>

                <p class="text-center mt-3">
                    Already have an account? <a href="login.html">Log in here</a>.
                </p>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer>
    <p>
        <a href="#">Terms of Use</a> |
        <a href="#">Cookie & Privacy Policy</a> |
        <a href="#">© 2025 TechNova Electronics</a>
    </p>
</footer>

<!-- JavaScript for Validation -->
<script>
    function validateField(obj) {
        let value = obj.value.trim();
        let id = obj.id;
        let errorDiv = document.getElementById(id + "Error");

        if (!value) {
            obj.style.borderColor = "#FF0000";
            errorDiv.textContent = id.charAt(0).toUpperCase() + id.slice(1) + " is required.";
            return false;
        }

        if (id === "email") {
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!emailPattern.test(value)) {
                obj.style.borderColor = "#FF0000";
                errorDiv.textContent = "Invalid email format.";
                return false;
            }
        }

        if (id === "confirmPassword") {
            let password = document.getElementById("password").value;
            if (value !== password) {
                obj.style.borderColor = "#FF0000";
                errorDiv.textContent = "Passwords do not match.";
                return false;
            }
        }

        obj.style.borderColor = "#198754"; // Green border on valid input
        errorDiv.textContent = "";
        return true;
    }

    function validateForm() {
        let fields = ["username", "email", "password", "confirmPassword"];
        let valid = true;
        for (let i = 0; i < fields.length; i++) {
            let obj = document.getElementById(fields[i]);
            if (!validateField(obj)) valid = false;
        }
        return valid; // prevent submission if false
    }
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
